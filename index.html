<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Jersey Golf Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* =========================================
       NEW JERSEY GOLF HUB - EMERALD THEME STYLES
       ========================================= */
    :root {
      --bg-primary: #06110d;
      --bg-card: rgba(12, 29, 22, 0.9);
      --border-color: rgba(22, 51, 39, 0.9);
      --border-glow: #10b981;
      --accent-green: #10b981;
      --accent-neon: #34d399;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body.light-mode {
      --bg-primary: #f0fdf4;
      --bg-card: #ffffff;
      --border-color: #a7f3d0;
      --border-glow: #059669;
      --accent-green: #059669;
      --accent-neon: #047857;
      --text-main: #064e3b;
      --text-muted: #047857;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-family);
      margin: 0;
      padding: 0 0 80px 0;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navigation */
    .navbar {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent-neon);
      letter-spacing: 1px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 12px;
      margin: 0;
      padding: 0;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-tab:hover, .nav-tab.active {
      color: var(--text-main);
      border-color: var(--border-color);
      background: rgba(52, 211, 153, 0.1);
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Container & Cards */
    .container {
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .page-section { display: none; }
    .page-section.active { display: block; }

    .hero {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-neon);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 12px;
    }

    h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 10px 0; }
    .hero p { color: var(--text-muted); font-size: 1.05rem; max-width: 650px; margin: 0 auto; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px;
      margin-top: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 { font-size: 1.35rem; color: var(--accent-neon); margin-top: 0; margin-bottom: 14px; }

    /* Vector Header Cards */
    .course-header-art {
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .course-header-art svg {
